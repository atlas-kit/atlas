name: Build with MSBuild

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - v*

    paths:
      - .github/workflows/build-msbuild.yml
      - src/**
      - vc18/**
      - vcpkg.json

  pull_request:
    paths:
      - .github/workflows/build-msbuild.yml
      - src/**
      - vc18/**
      - vcpkg.json

jobs:
  build-msbuild:
    name: Visual Studio Solution
    runs-on: windows-latest

    env:
      VCPKG_BUILD_TYPE: release
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg_cache
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Create vcpkg binary cache directory
        run: mkdir -p "${{ github.workspace }}/vcpkg_cache"
        shell: bash

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

      - name: Cache vcpkg
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-msbuild-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-msbuild-

      - name: Run vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6

      - name: Integrate vcpkg with MSBuild
        run: ${{ github.workspace }}\vcpkg\vcpkg.exe integrate install

      - name: Build solution
        working-directory: vc18
        # PlatformToolset override: the project pins v145 which is only available
        # in newer Visual Studio versions. Fall back to whatever the runner ships
        # with, so the CI does not lag behind preview toolsets.
        run: msbuild atlas.vcxproj /p:Configuration=Release /p:Platform=x64 /p:VcpkgEnableManifest=true /p:VcpkgManifestInstall=true /p:PlatformToolset=v143 /m

      - name: Upload artifact binary (exe)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tfs-msbuild-${{ github.sha }}
          path: |
            ${{ github.workspace }}/vc18/x64/Release/*.exe
            ${{ github.workspace }}/vc18/x64/Release/*.dll
